<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login | SENAI</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <img src="./assets/logo-senai.png" alt="SENAI" class="logo-senai" />
    </div>
  </header>

  <main class="centered">
    <div class="card login-card">
      <h2>Acessar sistema</h2>
      <input id="email" type="email" placeholder="E-mail" />
      <input id="senha" type="password" placeholder="Senha" />
      <button id="loginBtn" class="primary">Entrar</button>
      <p class="muted">Use o usuário padrão: <strong>admin@senai.local</strong> / senha: <strong>123</strong></p>
    </div>
  </main>

  <script src="./js/main.js"></script>
</body>
</html>
