<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Usuários | SENAI</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <img src="./assets/logo-senai.png" alt="SENAI" class="logo-senai" />
      <a href="cadastro.html" class="nav-link active">Usuário</a>
      <a href="arquivo.html" class="nav-link">Arquivo</a>
    </div>
    <div class="nav-right">
      <div class="user-info">
        <img src="./assets/user.png" alt="avatar" class="avatar" />
        <div class="user-text">
          <div id="userName">Usuário</div>
          <div class="muted" id="userEmail">email</div>
        </div>
      </div>
      <button id="logoutBtn" class="btn-logout">Logout</button>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="card-header">
        <h3>Usuários</h3>
        <div>
          <button id="novoUsuarioBtn" class="primary" onclick="location.href='novo-usuario.html'">+ Novo Usuário</button>
        </div>
      </div>

      <table class="table" id="tabelaUsuarios">
        <thead>
          <tr><th>Nome</th><th>CPF</th><th>Status</th><th>Ações</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script src="./js/main.js"></script>
  <script src="./js/cadastro.js"></script>
</body>
</html>
