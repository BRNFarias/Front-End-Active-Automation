<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Novo Usuário | SENAI</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="navbar">...</header>

  <main class="container">
    <div class="card">
      <h3>Cadastrar Usuário</h3>
      <form id="formUsuario">
        <label for="nome">Nome</label>
        <input id="nome" type="text" required />
        
        <label for="cpf">CPF (será o nome de login)</label>
        <input id="cpf" type="text" required />
        
        <div class="form-group-inline">
          <div class="form-field">
            <label for="inicio">Data de Início</label>
            <input id="inicio" type="date" required />
          </div>
          <div class="form-field">
            <label for="fim">Data de Fim (Expiração)</label>
            <input id="fim" type="date" required />
          </div>
        </div>
        <label for="senha">Senha Temporária</label>
        <input id="senha" type="password" required />
        
        <div style="margin-top:12px;">
          <button type="submit" class="primary">Salvar</button>
          <button type="button" onclick="location.href='cadastro.html'">Cancelar</button>
        </div>
      </form>
    </div>
  </main>


  <script src="./js/main.js"></script> 
  <script src="./js/novo-usuario.js"></script>
</body>
</html>
