<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Novo Usuário | SENAI</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <img src="./assets/logo-senai.png" alt="SENAI" class="logo-senai" />
      <a href="cadastro.html" class="nav-link">Usuário</a>
      <a href="arquivo.html" class="nav-link">Arquivo</a>
    </div>
    <div class="nav-right">
      <div class="user-info">
        <img src="./assets/user.png" alt="avatar" class="avatar" />
      </div>
      <button id="logoutBtn" class="btn-logout">Logout</button>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h3>Cadastrar Usuário</h3>
      <form id="formUsuario">
        <label>Nome</label>
        <input id="nome" type="text" required />
        <label>CPF</label>
        <input id="cpf" type="text" required />
        <label>Status</label>
        <select id="status">
          <option>Ativo</option>
          <option>Inativo</option>
        </select>
        <label>Senha (para login)</label>
        <input id="senha" type="password" required />
        <div style="margin-top:12px;">
          <button type="submit" class="primary">Salvar</button>
          <button type="button" onclick="location.href='cadastro.html'">Cancelar</button>
        </div>
      </form>
    </div>
  </main>

  <script src="./js/novo-usuario.js"></script>
</body>
</html>
